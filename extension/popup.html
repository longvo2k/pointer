<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f6f6f8;
        --border: #e4e4e9;
        --text: #18181b;
        --muted: #71717a;
        --accent: #7c3aed;
        --ok: #16a34a;
        --warn: #d97706;
        --off: #a1a1aa;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --hover: #ececf0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --surface: #222226;
          --border: #313137;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --accent: #a78bfa;
          --ok: #22c55e;
          --warn: #f59e0b;
          --off: #71717a;
          --danger: #ef4444;
          --danger-hover: #dc2626;
          --hover: #2c2c31;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px; margin: 0; padding: 14px;
        background: var(--bg); color: var(--text);
        font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        user-select: none; -webkit-user-select: none;
      }

      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .logo {
        width: 22px; height: 22px; border-radius: 6px; flex: none;
        display: grid; place-items: center;
        background: var(--accent); color: #fff;
      }
      h1 { font-size: 14px; font-weight: 650; margin: 0; flex: 1; }

      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 3px 9px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--border);
        font-size: 11.5px; font-weight: 600;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); }
      .pill[data-state="connected"] .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
      .pill[data-state="stopped"] .dot { background: var(--warn); }

      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px;
      }
      .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
      .agent { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 8px; }
      .agent .tag {
        font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
        color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .tab {
        display: flex; align-items: center; gap: 9px; width: 100%;
        padding: 7px 8px; margin: 0 -8px; width: calc(100% + 16px);
        border: 0; border-radius: 7px; background: transparent; color: inherit;
        font: inherit; text-align: left; cursor: pointer;
      }
      .tab:hover { background: var(--hover); }
      .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .fav {
        width: 16px; height: 16px; flex: none; border-radius: 3px;
        background: var(--border) center / cover no-repeat;
      }
      .tab-text { min-width: 0; flex: 1; }
      .tab-title, .tab-host { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tab-title { font-weight: 550; }
      .tab-host { font-size: 11.5px; color: var(--muted); }
      .go { color: var(--muted); flex: none; }

      .empty { color: var(--muted); font-size: 12.5px; padding: 2px 0; }

      .actions { margin-top: 12px; display: grid; gap: 8px; }
      button.btn {
        width: 100%; padding: 8px 10px; border-radius: 8px; cursor: pointer;
        font: inherit; font-weight: 600;
        display: flex; align-items: center; justify-content: center; gap: 7px;
      }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn-danger { background: var(--danger); color: #fff; border: 1px solid var(--danger); }
      .btn-danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
      .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
      .btn-secondary:hover { background: var(--hover); }
      .btn:disabled { opacity: .45; cursor: default; }
      .hint { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; text-align: center; }
      kbd {
        font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 0 4px; border: 1px solid var(--border); border-bottom-width: 2px;
        border-radius: 4px; background: var(--surface);
      }

      footer {
        margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        font-size: 11.5px; color: var(--muted);
      }
      .hub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .link {
        border: 0; background: none; padding: 0; cursor: pointer;
        color: var(--accent); font: inherit; font-weight: 600; flex: none;
      }
      .link:hover { text-decoration: underline; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M4 2.5 20 11l-7 2-3.5 7.5z"/></svg>
      </div>
      <h1>Pointer</h1>
      <span class="pill" id="status" data-state="offline"><span class="dot"></span><span id="status-text">Offline</span></span>
    </header>

    <section class="card">
      <div class="label">Agent</div>
      <div id="active" hidden>
        <div class="agent"><span id="agent-name">agent</span><span class="tag" id="agent-tag">driving</span></div>
        <button class="tab" id="tab" title="Show this tab">
          <span class="fav" id="fav"></span>
          <span class="tab-text">
            <div class="tab-title" id="tab-title">—</div>
            <div class="tab-host" id="tab-host"></div>
          </span>
          <svg class="go" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </button>
      </div>
      <div class="empty" id="empty">Waiting for an agent to connect.</div>
    </section>

    <div class="actions">
      <button class="btn btn-secondary" id="reconnect-main" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        Reconnect to hub
      </button>
      <div id="stop-wrap">
        <button class="btn btn-danger" id="stop">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          Stop agent
        </button>
        <p class="hint">Or press <kbd>Esc</kbd> / click anywhere on the page.</p>
      </div>
    </div>

    <footer>
      <span class="hub" id="hub" title="Hub address">ws://127.0.0.1:8790</span>
      <button class="link" id="reconnect">Reconnect</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
