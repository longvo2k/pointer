  <circle cx="44" cy="40" r="15" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
  <g transform="translate(31.2 32) scale(2.6)" filter="url(#shadow)">
    <path d="M4 2.5 20 11l-7 2-3.5 7.5z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
