name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: No outside network calls in the code
        run: |
          if grep -rnE "https?://[A-Za-z0-9]" bin lib extension --include='*.js' --include='*.mjs' \
             | grep -vE "127\.0\.0\.1|localhost|w3\.org/2000/svg"; then
            echo "Found a URL that is not localhost. Pointer must not talk to outside servers."; exit 1
          fi
      - name: No dynamic code
        run: |
          if grep -rnE "\beval\(|new Function\(|importScripts\(" bin lib extension; then
            echo "Found dynamic code execution."; exit 1
          fi
